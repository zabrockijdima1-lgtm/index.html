<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Football</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

video{
width:100%;
height:100vh;
background:black;
}
</style>
</head>

<body>

<video id="video" controls autoplay></video>

<script>

const stream =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

const video = document.getElementById("video")

if(Hls.isSupported()){

const hls = new Hls()
hls.loadSource(stream)
hls.attachMedia(video)

}else{

video.src = stream

}

</script>

</body>
</html>
