<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Football</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

.match{
background:#1e293b;
margin:10px;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.match:hover{
background:#334155;
}

#playerPage{
display:none;
}

video{
width:100%;
height:100vh;
background:black;
}

button{
margin:10px;
padding:10px 20px;
background:#2563eb;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="matchesPage">

<h2>⚽ Live Football</h2>

<div class="match" onclick="play()">
<h3>Sports Channel Live</h3>
<p>LIVE</p>
</div>

</div>

<div id="playerPage">

<button onclick="back()">⬅ Назад</button>

<video id="video" controls autoplay></video>

</div>

<script>

const stream =
"https://austchannel-live.akamaized.net/hls/live/2002736/austchannel-sport/master.m3u8"

function play(){

document.getElementById("matchesPage").style.display="none"
document.getElementById("playerPage").style.display="block"

const video = document.getElementById("video")

if(Hls.isSupported()){

const hls = new Hls()
hls.loadSource(stream)
hls.attachMedia(video)

}else{

video.src = stream

}

}

function back(){

document.getElementById("playerPage").style.display="none"
document.getElementById("matchesPage").style.display="block"

}

</script>

</body>
</html>
