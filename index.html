<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football Live</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

#matches{
padding:10px;
}

.match{
background:#1e293b;
margin:10px;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.match:hover{
background:#334155;
}

#playerPage{
display:none;
}

iframe{
width:100%;
height:100vh;
border:none;
}

button{
margin:10px;
padding:10px 20px;
background:#2563eb;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="matchesPage">

<h2>⚽ Live Matches</h2>

<div id="matches"></div>

</div>

<div id="playerPage">

<button onclick="back()">⬅ Назад</button>

<iframe id="player"></iframe>

</div>

<script>

const matches = [

{
home:"Lech Poznan",
away:"Shakhtar Donetsk",
time:"21:00",
stream:"https://www.youtube.com/watch?v=wdyAu7Dw018"
}

]

const container = document.getElementById("matches")

matches.forEach(match => {

let div = document.createElement("div")

div.className = "match"

div.innerHTML = `
<h3>${match.home} vs ${match.away}</h3>
<p>${match.time}</p>
`

div.onclick = () => openStream(match.stream)

container.appendChild(div)

})

function openStream(url){

document.getElementById("matchesPage").style.display="none"
document.getElementById("playerPage").style.display="block"

let videoId = url.split("v=")[1]

document.getElementById("player").src =
"https://www.youtube.com/embed/"+videoId+"?autoplay=1"

}

function back(){

document.getElementById("playerPage").style.display="none"
document.getElementById("matchesPage").style.display="block"

document.getElementById("player").src=""

}

</script>

</body>
</html>
