<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football Live</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

.match{
background:#1e293b;
margin:10px;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.match:hover{
background:#334155;
}

iframe{
width:100%;
height:100vh;
border:none;
}

#player{
display:none;
}

button{
margin:10px;
padding:10px 20px;
background:#2563eb;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="matches"></div>

<div id="player">

<button onclick="back()">⬅ Назад</button>

<iframe id="video"></iframe>

</div>

<script>

const matches = [

{
home:"Lech Poznan",
away:"Shakhtar",
youtube:"wdyAu7Dw018"
},

{
home:"Real Madrid",
away:"Barcelona",
youtube:"jNQXAC9IVRw"
}

]

const container = document.getElementById("matches")

matches.forEach(match => {

let div = document.createElement("div")

div.className = "match"

div.innerHTML = `
<h3>${match.home} vs ${match.away}</h3>
<p>LIVE</p>
`

div.onclick = () => play(match.youtube)

container.appendChild(div)

})

function play(id){

document.getElementById("matches").style.display="none"
document.getElementById("player").style.display="block"

document.getElementById("video").src =
"https://www.youtube.com/embed/"+id+"?autoplay=1"

}

function back(){

document.getElementById("player").style.display="none"
document.getElementById("matches").style.display="block"

document.getElementById("video").src=""

}

</script>

</body>
</html>
