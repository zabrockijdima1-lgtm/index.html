
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚽ Live Football</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
padding:10px;
}

.match{
background:#1e293b;
margin:10px;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.match:hover{
background:#334155;
}

iframe{
width:100%;
height:100vh;
border:none;
}

#player{
display:none;
}

button{
margin-top:10px;
padding:8px 15px;
background:#2563eb;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>⚽ Live Matches</h1>

<div id="matches"></div>

<div id="player">

<button onclick="back()">⬅ Назад</button>

<iframe id="video"></iframe>

</div>

<script>

const API_KEY = "08ec1f0c02f0ef10187b546c212272ba"

async function loadMatches(){

let res = await fetch(
"https://v3.football.api-sports.io/fixtures?live=all",
{
headers:{
"x-apisports-key":API_KEY
}
})

let data = await res.json()

let container = document.getElementById("matches")

data.response.forEach(m => {

let div = document.createElement("div")

div.className="match"

div.innerHTML = `
<h3>${m.teams.home.name} vs ${m.teams.away.name}</h3>
<p>${m.fixture.status.elapsed || 0}'</p>
<button onclick="play()">📺 Дивитися трансляцію</button>
`

container.appendChild(div)

})

}

function play(){

document.getElementById("matches").style.display="none"
document.getElementById("player").style.display="block"

document.getElementById("video").src =
"https://www.youtube.com/embed/jNQXAC9IVRw?autoplay=1"

}

function back(){

document.getElementById("player").style.display="none"
document.getElementById("matches").style.display="block"

document.getElementById("video").src=""

}

loadMatches()

</script>

</body>
</html>
