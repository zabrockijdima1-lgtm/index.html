<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football Live</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

#matches{
padding:10px;
}

.match{
background:#1e293b;
margin:10px;
padding:15px;
border-radius:10px;
cursor:pointer;
}

.match:hover{
background:#334155;
}

#player{
display:none;
}

video{
width:100%;
height:100vh;
background:black;
}

button{
margin:10px;
padding:10px 20px;
background:#2563eb;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="matchesPage">

<h2>⚽ Live Matches</h2>

<div id="matches"></div>

</div>

<div id="player">

<button onclick="back()">⬅ Назад</button>

<video id="video" controls autoplay></video>

</div>

<script>

const matches = [

{
home:"Real Madrid",
away:"Barcelona",
time:"21:00",
stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
home:"Arsenal",
away:"Chelsea",
time:"19:30",
stream:"https://test-streams.mux.dev/test_001/stream.m3u8"
}

]

const container = document.getElementById("matches")

matches.forEach(match => {

let div = document.createElement("div")

div.className = "match"

div.innerHTML = `
<h3>${match.home} vs ${match.away}</h3>
<p>${match.time}</p>
`

div.onclick = () => openStream(match.stream)

container.appendChild(div)

})

function openStream(stream){

document.getElementById("matchesPage").style.display="none"
document.getElementById("player").style.display="block"

const video = document.getElementById("video")

if(Hls.isSupported()){

const hls = new Hls()
hls.loadSource(stream)
hls.attachMedia(video)

}else{

video.src = stream

}

}

function back(){

document.getElementById("player").style.display="none"
document.getElementById("matchesPage").style.display="block"

}

</script>

</body>
</html>
